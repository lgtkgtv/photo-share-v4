# Grafana Dashboard Provisioning
apiVersion: 1

providers:
  - name: 'photo-share-dashboards'
    orgId: 1
    folder: 'Photo Share Service'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json