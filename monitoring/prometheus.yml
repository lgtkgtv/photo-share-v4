# Prometheus Configuration for Photo Share Service
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: 'photo-share-consul'
    environment: 'production'

# Rules for alerting
rule_files:
  - "alert_rules.yml"

# Alert manager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - alertmanager:9093

# Scrape configurations
scrape_configs:
  # Photo Share Service metrics
  - job_name: 'photo-share-service'
    static_configs:
      - targets: ['photo-share-platform:8000']
    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 10s
    params:
      format: ['prometheus']

  # PostgreSQL metrics (if exporter is available)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
    scrape_interval: 30s

  # Redis metrics (if exporter is available)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 30s

  # Node/System metrics
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
    scrape_interval: 30s

  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Docker container metrics (if available)
  - job_name: 'docker'
    static_configs:
      - targets: ['docker-metrics:9323']
    scrape_interval: 30s

