# AlertManager Configuration
global:
  smtp_smarthost: 'localhost:587'
  smtp_from: 'alertmanager@photo-share-service.com'

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'web.hook'

receivers:
- name: 'web.hook'
  webhook_configs:
  - url: 'http://127.0.0.1:5001/'
    send_resolved: true

