name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run test suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync --extra all

      # tests/unit/ is fully self-contained (SQLite in-memory, no live services).
      # This is the "original unit tests" gate for this workflow.
      - name: Run unit tests
        run: uv run pytest tests/unit/ -v

      # These two files were rewritten to be self-contained (SQLite, mocked
      # dependencies) rather than requiring live auth-service/app-service
      # instances -- everything else in tests/integration/ and tests/security/
      # still does require live services and is intentionally not run here.
      # See README.md "Current State" / "Testing & Validation" for the full
      # breakdown of what is and isn't covered by this job.
      - name: Run self-contained integration/security tests
        run: |
          uv run pytest tests/integration/test_media_endpoints.py -v
          uv run pytest tests/security/test_waf_protection.py -v

      # Phase 1 product API (albums/shares/comments/tags/analytics + signed
      # share-download URLs) -- 66 checks total, SQLite-backed, run as plain
      # scripts rather than via pytest (see services/photoshare/tests/).
      - name: Run Phase 1 product API e2e checks
        run: |
          uv run python services/photoshare/tests/test_albums_e2e.py
          uv run python services/photoshare/tests/test_shares_comments_tags_analytics_e2e.py
          uv run python services/photoshare/tests/test_share_download_e2e.py

  docker-compose-smoke-test:
    name: Docker Compose smoke test (real Postgres)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate env files
        run: ./scripts/generate-env-files.sh

      - name: Start services
        run: docker compose -f docker-compose.separated.yml up --build -d

      - name: Wait for health checks
        run: |
          for i in $(seq 1 60); do
            auth_ok=false
            app_ok=false
            curl -sf http://localhost:8001/health > /dev/null && auth_ok=true
            curl -sf http://localhost:8000/health > /dev/null && app_ok=true
            if [ "$auth_ok" = true ] && [ "$app_ok" = true ]; then
              echo "Both services healthy"
              exit 0
            fi
            echo "Waiting for services... ($i/60)"
            sleep 5
          done
          echo "Services did not become healthy in time"
          docker compose -f docker-compose.separated.yml logs
          exit 1

      - name: Register + login smoke test against real Postgres
        run: |
          set -e
          curl -sf -X POST http://localhost:8001/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email": "ci-smoke-test@example.com", "password": "TestPass123!", "first_name": "CI", "last_name": "Smoke"}'
          TOKEN=$(curl -sf -X POST http://localhost:8001/api/auth/login \
            -F "username=ci-smoke-test@example.com" \
            -F "password=TestPass123!" | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
          test -n "$TOKEN"
          # Proves the auth service and app service share the same JWT secret
          # (a real, previously-broken bug fixed in this codebase -- see
          # docker-compose.separated.yml's comment on JWT_SECRET_KEY).
          curl -sf -H "Authorization: Bearer $TOKEN" http://localhost:8000/api/photos/

      - name: Show logs on failure
        if: failure()
        run: docker compose -f docker-compose.separated.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.separated.yml down -v
