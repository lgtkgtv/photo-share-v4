[tool:pytest]
# PhotoShare Test Configuration
# =============================

# Test discovery
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Add project root to Python path
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=services
    --cov-report=html:tests/coverage/html
    --cov-report=term-missing
    --cov-report=xml:tests/coverage/coverage.xml
    --cov-report=json:tests/coverage/coverage.json
    --cov-fail-under=70
    --durations=10
    --color=yes

# Test markers for categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for service communication  
    functional: End-to-end functional workflow tests
    security: Security and RBAC testing
    security_compliance: Security compliance and standards testing
    slow: Tests that take a long time to run
    network: Tests that require network access
    database: Tests that require database access
    auth: Tests related to authentication
    rbac: Tests related to role-based access control
    photos: Tests related to photo functionality
    performance: Performance and load tests

# Asyncio configuration
asyncio_mode = auto

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# Uncomment to run tests in parallel (requires pytest-xdist)
# addopts = -n auto

# Coverage configuration
[tool:coverage:run]
source = services
branch = true
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */migrations/*
    */alembic/*
    */conftest.py
    */setup.py

[tool:coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod