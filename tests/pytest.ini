[tool:pytest]
# Pytest configuration for Photo Share Social Media Platform tests

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Minimum Python version
minversion = 3.8

# Add project root to Python path
addopts = 
    --strict-markers
    --strict-config
    --verbose
    --tb=short
    --cov=services/photoshare
    --cov-report=html:tests/coverage_html
    --cov-report=term-missing
    --cov-report=xml:tests/coverage.xml
    --cov-fail-under=85
    --durations=10

# Test markers for categorization
markers =
    unit: Unit tests for individual components
    integration: Integration tests for API endpoints and workflows
    api: API endpoint tests
    security: Security-focused tests including OWASP compliance
    performance: Performance and load testing
    e2e: End-to-end user journey tests
    slow: Tests that take longer to run
    database: Tests requiring database connections
    auth: Tests requiring authentication
    social: Tests for social media features
    albums: Tests for album management
    profiles: Tests for user profiles
    notifications: Tests for notification system
    sharing: Tests for photo sharing features
    tags: Tests for tagging and search functionality

# Asyncio configuration
asyncio_mode = auto

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s: %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Warnings configuration
filterwarnings =
    error
    ignore::UserWarning
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Test timeout (in seconds)
timeout = 300

# Parallel execution
# Uncomment to run tests in parallel (requires pytest-xdist)
# addopts = -n auto

# Coverage configuration
[tool:coverage:run]
source = services/photoshare
omit = 
    */tests/*
    */test_*
    */__pycache__/*
    */venv/*
    */env/*
    */migrations/*
    */alembic/*

[tool:coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if settings.DEBUG
    raise AssertionError
    raise NotImplementedError
    if 0:
    if __name__ == .__main__.:
    class .*\bProtocol\):
    @(abc\.)?abstractmethod