# Development Environment Configuration
# Usage: docker compose -f docker-compose.dev.yml up --build

services:
  # Photo Share Application Service  
  photo-share-app:
    build:
      context: .
      dockerfile: services/photoshare/Dockerfile.database
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      PYTHONPATH: /app
      ENVIRONMENT: development
      DATABASE_URL: postgresql+asyncpg://postgres:postgres123@photo-share-db:5432/photo_share
    networks:
      - photo-share-network
    depends_on:
      photo-share-db:
        condition: service_healthy
    restart: unless-stopped
      
  # PostgreSQL Database
  photo-share-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: photo_share
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    ports:
      - "5433:5432"
    networks:
      - photo-share-network
    volumes:
      - photo_share_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d photo_share"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

networks:
  photo-share-network:
    name: photo-share-dev
    driver: bridge

volumes:
  photo_share_dev_data:
    name: photo-share-dev-data