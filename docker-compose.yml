services:
  backend:
    build:
      context: .
      dockerfile: services/photoshare/Dockerfile.database
    env_file: .env
    ports:
      - "8000:8000"
    environment:
      - PYTHONPATH=/app
    networks:
      - default
      - platform_network
    depends_on:
      - db
      
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: photo_share
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
    ports:
      - "5433:5432"
    networks:
      - default
      - platform_network
    volumes:
      - postgres_data:/var/lib/postgresql/data

networks:
  platform_network:
    driver: bridge

volumes:
  postgres_data:
