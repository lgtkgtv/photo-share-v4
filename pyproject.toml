[project]
name = "photo-share-consul"
version = "2.3.0"
description = "Production-ready Photo Sharing Service with comprehensive testing"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Core service dependencies
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "alembic>=1.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "aiofiles>=23.2.1",
    "pillow>=10.0.0",
    "prometheus-client>=0.19.0",
    
    # Redis with Python 3.11 compatibility
    "redis>=5.0.0",
    "aioredis>=2.0.1,<3.0.0",
    
    # Email and validation
    "email-validator>=2.1.0",
    "bcrypt>=4.1.0",
    
    # HTTP clients
    "httpx>=0.25.0",
    "requests>=2.31.0",
]

[project.optional-dependencies]
test = [
    # Testing framework
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-html>=4.1.0",
    "pytest-xdist>=3.5.0",
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "pytest-metadata>=3.1.0",
    
    # Test databases
    "aiosqlite>=0.19.0",
    "sqlite3",
    
    # Mock and fixtures
    "faker>=20.1.0",
    "factory-boy>=3.3.0",
    
    # Performance testing
    "locust>=2.17.0",
    
    # Security testing
    "bandit>=1.7.5",
    "safety>=2.3.0",
    
    # Test utilities
    "coverage>=7.3.0",
    "coverage-badge>=1.1.0",
    "xmltodict>=0.13.0",
]

dev = [
    # Development tools
    "black>=23.9.0",
    "isort>=5.12.0",
    "flake8>=6.1.0",
    "mypy>=1.6.0",
    "pre-commit>=3.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["services/photoshare"]

[tool.pytest.ini_options]
minversion = "7.4"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--cov=services/photoshare",
    "--cov-report=term-missing",
    "--cov-report=html:tests/coverage/html",
    "--cov-report=xml:tests/coverage/coverage.xml",
    "--html=tests/reports/pytest_report.html",
    "--self-contained-html",
]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: Unit tests",
    "integration: Integration tests", 
    "api: API tests",
    "e2e: End-to-end tests",
    "performance: Performance tests",
    "security: Security tests",
    "infrastructure: Infrastructure tests",
    "slow: Slow running tests",
    "external: Tests requiring external services",
]

[tool.coverage.run]
source = ["services/photoshare"]
omit = [
    "*/tests/*",
    "*/test_*",
    "*/__pycache__/*",
    "*/venv/*",
    "*/env/*",
    "*/.venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 100
known_first_party = ["photoshare"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
warn_unreachable = true
strict_equality = true