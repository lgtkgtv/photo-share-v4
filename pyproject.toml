[project]
name = "photo-share-consul"
version = "2.4.0"
description = "Production-ready photo sharing platform with separated microservices architecture, enterprise-grade security, and comprehensive documentation"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "PhotoShare Team", email = "team@photoshare.dev" }
]
license = { text = "MIT" }
keywords = ["photo", "sharing", "fastapi", "microservices", "security"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Multimedia :: Graphics",
]

# Core application dependencies
dependencies = [
    # Core FastAPI framework
    "fastapi>=0.104.1",
    "uvicorn[standard]>=0.24.0",
    "python-multipart>=0.0.6",
    "starlette>=0.27.0",
    
    # Database (PostgreSQL async)
    "sqlalchemy>=2.0.23",
    "asyncpg>=0.29.0",
    "alembic>=1.13.1",
    
    # Authentication & Security
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    # passlib 1.7.4 is unmaintained (no release since 2020) and its bcrypt backend
    # detects the installed bcrypt version via bcrypt.__about__.__version__, an
    # attribute bcrypt removed in 4.1.0 -- anything >=4.1 breaks password hashing
    # outright (ValueError from passlib's own internal self-test). Not a security
    # downgrade: bcrypt itself has no relevant advisory in this range.
    "bcrypt>=4.0.1,<4.1",
    "cryptography>=42.0.0",
    "pyjwt>=2.8.0",
    
    # SSO & OAuth
    "httpx>=0.25.2",
    "python-oauth2>=1.1.1",
    
    # 2FA Support
    "pyotp>=2.9.0",
    "qrcode[pil]>=7.4.2",
    
    # SMS providers (optional)
    "twilio>=8.10.3",
    "boto3>=1.34.0",
    
    # Image processing
    "pillow>=10.1.0",
    "pillow-heif>=0.13.0",
    
    # File storage
    "aiofiles>=23.2.0",
    
    # Redis caching
    "redis>=5.0.1",
    "aioredis>=2.0.1",
    
    # Monitoring
    "prometheus-client>=0.19.0",
    
    # Data validation
    "pydantic>=2.5.3",
    "pydantic-core>=2.14.6",
    "email-validator>=2.1.0",
    
    # Core utilities
    "requests>=2.31.0",
    "aiohttp>=3.9.1",
    "typing-extensions>=4.8.0",
    "python-dotenv>=1.0.0",
    
    # Email notifications
    "emails>=0.6",
    
    # Security-critical packages (pinned versions)
    "jinja2>=3.1.6",
    "setuptools>=78.1.1",
    "certifi>=2024.7.4",
]

[project.optional-dependencies]
# Testing dependencies
test = [
    "pytest>=7.4.3",
    "pytest-asyncio>=0.21.1",
    "pytest-cov>=4.1.0", 
    "pytest-mock>=3.12.0",
    "pytest-benchmark>=4.0.0",
    "pytest-xdist>=3.5.0",
    "faker>=20.1.0",
    "factory-boy>=3.3.0",
    "fakeredis>=2.21.0",
    "aiosqlite>=0.19.0",
]

# Development tools
dev = [
    "black>=23.0.0",
    "isort>=5.12.0",
    "mypy>=1.6.0",
    "pre-commit>=3.0.0",
]

# Security and analysis tools
security = [
    "safety>=3.0.0",
    "bandit>=1.7.5",
    "semgrep>=1.45.0",
]

# Documentation and reporting tools  
docs = [
    "rich>=13.7.0",
    "click>=8.1.0",
    "jsonschema>=4.19.0",
    "packaging>=23.0",
    "toml>=0.10.2",
    "markdown>=3.5.0",
    "pygments>=2.17.0",
    "pyyaml>=6.0.1",
    "python-dateutil>=2.8.2",
]

# All development dependencies
all = [
    "photo-share-consul[test,dev,security,docs]"
]
